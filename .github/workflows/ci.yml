name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      surrealdb:
        image: surrealdb/surrealdb:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        env:
          SURREAL_USER: root
          SURREAL_PASS: root

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration
        env:
          SURREALDB_URL: ws://127.0.0.1:8000/rpc
          SURREALDB_USER: root
          SURREALDB_PASS: root
